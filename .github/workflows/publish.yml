name: Publish .NET SDK (NuGet)

# Pushes Taqlyn.Sdk via NuGet.org Trusted Publishing (OIDC).
# No NUGET_API_KEY — configure Trusted Publishing on nuget.org for this repo:
#   owner: taqlyn (NuGet org), workflow: publish.yml, environment: nuget

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-dotnet-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, Test & Push NuGet Package
    runs-on: ubuntu-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Taqlyn.Sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run unit tests
        run: dotnet test Taqlyn.Sdk.Tests/Taqlyn.Sdk.Tests.csproj --nologo

      - name: Pack NuGet Package
        run: dotnet pack -c Release -o ./dist Taqlyn.Sdk.csproj

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: rutvik24

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./dist/*.nupkg
          -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          -s https://api.nuget.org/v3/index.json
          --skip-duplicate
